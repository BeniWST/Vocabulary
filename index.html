<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px);-webkit-text-size-adjust:100%}

#app{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
h1{font-size:28px;margin:2px 0 0;letter-spacing:-.02em} h2{font-size:21px;margin:0 0 12px} h3{font-size:17px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}

.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--text);padding:10px 4px;border-radius:11px;font:inherit;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cta{display:block;width:100%;margin:24px 0 10px;border:0;border-radius:18px;padding:18px;font:inherit;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 26px rgba(108,92,231,.35)}
.cta:disabled{background:var(--surface2);color:var(--muted);box-shadow:none}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px;background:var(--surface2);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--border)}

.wide{width:100%}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap} .grow{flex:1}

.sesstop{display:flex;align-items:center;gap:12px;margin-bottom:16px} .sesstop .bar{flex:1;height:9px}
.icon{border:0;background:var(--surface2);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;flex:none}

.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:4px}
.urow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.urow .n{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .urow .bar{flex:1} .urow .p{width:42px;text-align:right;color:var(--muted)}
/* Eltern */
.f{margin-bottom:12px} .f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 4px 6px}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;font-size:16px}
textarea.field{min-height:180px;font-size:16px;resize:vertical;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;margin:8px 4px;font-size:15px}
.check input{width:20px;height:20px}
.prev{font-size:14px;margin:10px 4px} .prev .badl{color:var(--bad)}
.vrow{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);padding:11px 2px;font:inherit;font-size:15px}
.vrow b{flex:1;font-weight:600;word-break:break-word} .vrow span{flex:1;color:var(--muted);word-break:break-word}
.boxes{font-size:11px;color:var(--muted);white-space:nowrap}
.wk{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.wkd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wkd b{font-size:11px;color:var(--text);min-height:14px}
.wkb{width:100%;height:64px;background:var(--surface2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.wkb i{display:block;width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:8px}
.wkd.today span{color:var(--accent);font-weight:700}
.family{border-left-color:#0ea5e9}
details.fx summary{list-style:none;cursor:pointer;display:grid;gap:4px} details.fx summary::-webkit-details-marker{display:none}
.fxt{font-weight:700;font-size:16px} .fxb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fxx{display:block;font:600 15px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);border-radius:10px;padding:8px 10px;white-space:normal}
.fxv{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px} .fxv td{padding:5px 4px;border-bottom:1px solid var(--border);vertical-align:top} .fxv td:first-child{font-weight:700;white-space:nowrap;width:30%}
.psub{font-size:14px;color:var(--muted);margin-top:6px}
.reward{border-left:5px solid #f59e0b} .reward.done{border-left-color:var(--ok);background:var(--okbg)}
body[data-lang="ma"]{--lang:#10b981} body[data-lang="wi"]{--lang:#0ea5e9} body[data-lang="de"]{--lang:#111827}
.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border:0} .srow .btn{padding:9px 12px;font-size:14px;flex:none}
.lock{text-align:center;padding-top:24px} .lock .e{font-size:48px}
.pinin{text-align:center;letter-spacing:.4em;font-size:24px!important}
/* Tabbar, Toast, Modal */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);z-index:10}
#tabbar button{flex:1;max-width:150px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:4px;border-radius:12px}
#tabbar button .ti{display:block;font-size:22px;filter:grayscale(1);opacity:.7}
#tabbar button.on{color:var(--accent)} #tabbar button.on .ti{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(16px);background:#1f2340;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:90vw;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)} #toast.err{background:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(5,6,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
#modal .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:pop .2s}
.plist{display:grid;gap:10px;margin-bottom:14px}
.lbtn{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:18px;padding:14px 16px;font:inherit;font-size:18px;font-weight:700;box-shadow:var(--shadow);margin-bottom:10px;text-align:left}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;flex:none}
</style>

<script src="config.js"></script>
<script>
'use strict';
/* ============================================================
   Vokabeltrainer – App-Logik
   Datenmodell: Familien-Konto → mehrere Lernprofile (Kinder)
   → je Profil eigene Vokabeln, eigener Lernstand, eigene Punkte
   ============================================================ */
const C = window.VT_CONFIG || {};
const LANGS = C.languages || { en: { name: 'Englisch', flag: '🇬🇧', speech: 'en-GB' } };
if (!LANGS.de) LANGS.de = { name: 'Deutsch', flag: '🇩🇪', speech: 'de-DE' };   // Deutsch-Übungen (Wortarten, Artikel, Diktat)
if (!LANGS.wi) LANGS.wi = { name: 'Wissen', flag: '💡', speech: null };          // Frage-Antwort-Karten (Sachunterricht, Geschichte, Bio …)
const MATH = { name: 'Mathe', flag: '🧮' };                                          // Mathe-Trainer: Aufgaben werden erzeugt, nicht importiert
const CLOUD = !!(C.supabaseUrl && C.supabaseKey);
const VERSION = '1.6';
const PARENT = '__parent';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (a, b) => b ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0;
const pick = a => a[Math.floor(Math.random() * a.length)];
const collator = new Intl.Collator('de', { numeric: true, sensitivity: 'base' });
const ts = x => Date.parse(x || 0) || 0;
const nowIso = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
function dayStr(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return dayStr(d); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = crypto.getRandomValues(new Uint8Array(1))[0] & 15;
    return (c === 'x' ? r : (r & 3 | 8)).toString(16);
  });
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem('vt_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vt_' + k, JSON.stringify(v)); } catch (e) { console.warn('Speichern fehlgeschlagen', e); } },
  del(k) { try { localStorage.removeItem('vt_' + k); } catch (e) { } }
};

/* ============================================================
   Zustand
   ============================================================ */
const S = {
  learners: LS.get('learners', []),            // [{id, name, created_at}]
  prefs: Object.assign({
    learner: null,          // Lernprofil dieses Geräts (oder '__parent')
    plearner: null,         // im Eltern-Bereich gewähltes Kind
    slearner: null,         // in der Statistik gewähltes Kind
    lang: Object.keys(LANGS)[0], unit: '*', dir: 'mix', mode: 'type',
    pin: null, autoSpeak: false, everSynced: false, lastSync: null
  }, LS.get('prefs', {})),
  auth: LS.get('auth', null)
};
const savePrefs = () => LS.set('prefs', S.prefs);
const saveLearners = () => LS.set('learners', S.learners);
const learner = id => S.learners.find(l => l.id === id);
const sortLearners = () => S.learners.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));

/* ---------- Daten je Lernprofil ---------- */
const DEFAULT_STATE = { goal: 20, settingsAt: null, xp: 0, streak: 0, lastDay: null, today: { day: null, count: 0 }, showMath: true, mathLevel: null, reward: null, math: {}, ext: {}, log: {}, family: null, updated_at: null };
const freshState = (...src) => Object.assign({}, DEFAULT_STATE, { today: { day: null, count: 0 }, math: {}, ext: {}, log: {} }, ...src);   // eigene Objekte je Kind
const DB = {};
function data(lid) {
  if (!lid || lid === PARENT) return null;
  if (!DB[lid]) DB[lid] = {
    lid,
    vocab: LS.get('vocab_' + lid, []),
    progress: LS.get('progress_' + lid, {}),
    state: freshState(LS.get('state_' + lid, {})),
    dirty: new Set(LS.get('dirty_' + lid, [])),
    stateDirty: LS.get('stateDirty_' + lid, false),
    everSynced: LS.get('ever_' + lid, false)
  };
  return DB[lid];
}
function saveData(d) {
  if (!d) return;
  LS.set('vocab_' + d.lid, d.vocab); LS.set('progress_' + d.lid, d.progress); LS.set('state_' + d.lid, d.state);
  LS.set('dirty_' + d.lid, [...d.dirty]); LS.set('stateDirty_' + d.lid, d.stateDirty); LS.set('ever_' + d.lid, d.everSynced);
}
function dropData(lid) {
  delete DB[lid];
  ['vocab_', 'progress_', 'state_', 'dirty_', 'stateDirty_', 'ever_'].forEach(p => LS.del(p + lid));
}
const isLearnerDevice = () => !!(S.prefs.learner && S.prefs.learner !== PARENT && learner(S.prefs.learner));
const AD = () => isLearnerDevice() ? data(S.prefs.learner) : null;     // aktives Profil dieses Geräts
function PD() {   // Profil im Eltern-Bereich
  if (!learner(S.prefs.plearner)) S.prefs.plearner = isLearnerDevice() ? S.prefs.learner : (S.learners[0] || {}).id || null;
  return data(S.prefs.plearner);
}
function SD() {   // Profil in der Statistik
  if (!learner(S.prefs.slearner)) S.prefs.slearner = isLearnerDevice() ? S.prefs.learner : (S.learners[0] || {}).id || null;
  return data(S.prefs.slearner);
}

function touchState(d) { d.state.updated_at = nowIso(); d.stateDirty = true; }
function todayCount(d) { const t = d.state.today; return t && t.day === dayStr() ? t.count : 0; }
function currentStreak(d) { const st = d.state; return (st.lastDay === dayStr() || st.lastDay === addDays(-1)) ? (st.streak || 0) : 0; }
function levelInfo(xp) {
  let lvl = 1, need = 100, base = 0;
  while (xp >= base + need) { base += need; lvl++; need = 100 + (lvl - 1) * 50; }
  return { lvl, cur: xp - base, need };
}
function mergeState(a, b) {
  a = a || {}; b = b || {};
  const m = freshState(b, a);

    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

function check(input, expected) {
  const u = norm(input);
  if (!u) return { ok: false };
  const list = alts(expected);
  for (const a of list) if (u === a) return { ok: true };
  for (const a of list) if (noAcc(u) === noAcc(a)) return { ok: true, hint: 'Achte auf die Akzente.' };
  for (const a of list) {
    if (!strip(a)) continue;
    if (noAcc(strip(u)) === noAcc(strip(a))) {
      if (artOf(u) && artOf(a) && artOf(u) !== artOf(a)) return { ok: false, near: true, hint: 'Falscher Artikel.' };
      const accHint = strip(u) !== strip(a) ? ' Achte auch auf die Akzente.' : '';
      if (artOf(a) && !artOf(u)) return { ok: true, hint: 'Denk beim nächsten Mal an „' + artOf(a) + '“.' + accHint };
      return { ok: true, hint: accHint.trim() || undefined };
    }
  }
  for (const a of list) {
    const x = noAcc(strip(u)), y = noAcc(strip(a));
    if (y.length >= 5 && lev(x, y) <= 1) return { ok: false, near: true, hint: 'Nur ein Buchstabe falsch – Tippfehler?' };

function speak(text, lang, rate) {
  const code = (LANGS[lang] || {}).speech;
  if (!code || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\([^)]*\)|\[[^\]]*\]/g, '').split(/[;\/]/)[0]);
    u.lang = code; u.rate = rate || 0.9;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.replace('_', '-') === code) || voices.find(v => v.lang.startsWith(code.slice(0, 2)));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { console.warn(e); }
}

async function syncLearners() {

async function syncLearner(d) {
  const f = 'learner_id=eq.' + d.lid;
  // 1) Vokabeln holen (Server ist maßgeblich)
  const remote = await API.all('vocab', 'id,lang,unit,term,translation,note,created_at', 'created_at.asc,id.asc', f);
  if (!remote.length && d.vocab.length && !d.everSynced) {
    for (const c of chunks(d.vocab, 500)) await API.req('vocab', { method: 'POST', body: c.map(v => vocabRow(v, d.lid)), prefer: 'resolution=ignore-duplicates,return=minimal' });
  } else d.vocab = remote;
  const ids = new Set(d.vocab.map(v => v.id));

  // 2) Lernstand hochladen
  const sent = {}, rows = [];
  for (const k of [...d.dirty]) {
    const [id, dir] = k.split('|'), p = d.progress[k];
    if (!p || !ids.has(id)) { d.dirty.delete(k); continue; }
    sent[k] = p.updated_at;
    rows.push({ learner_id: d.lid, vocab_id: id, dir, box: p.box, due: p.due, correct: p.correct || 0, wrong: p.wrong || 0, updated_at: p.updated_at });
  }
  const up = list => chunks(list, 500).reduce((pr, c) => pr.then(() => API.req('progress?on_conflict=learner_id,vocab_id,dir', { method: 'POST', body: c, prefer: 'resolution=merge-duplicates,return=minimal' })), Promise.resolve());
  const std = rows.filter(r => r.dir === 'fd' || r.dir === 'df'), ext = rows.filter(r => r.dir !== 'fd' && r.dir !== 'df');
  await up(std);
  let extFailed = false;
  if (ext.length) {
    try { await up(ext); S.extWarn = false; }
    catch (e) { if (e.status === 400 || e.status === 409) { extFailed = true; S.extWarn = true; } else throw e; }   // Datenbank kennt Deutsch-Übungen noch nicht
  }
  for (const k of Object.keys(sent)) {
    if (extFailed && !/\|(fd|df)$/.test(k)) continue;
    if (d.progress[k] && d.progress[k].updated_at === sent[k]) d.dirty.delete(k);
  }

  // 3) Lernstand holen und zusammenführen
  const rp = await API.all('progress', 'vocab_id,dir,box,due,correct,wrong,updated_at', 'vocab_id.asc,dir.asc', f);
  for (const r of rp) {
    const k = pkey(r.vocab_id, r.dir), l = d.progress[k];
    if (d.dirty.has(k)) continue;
    if (!l || ts(r.updated_at) > ts(l.updated_at)) d.progress[k] = { box: r.box, due: r.due, correct: r.correct, wrong: r.wrong, updated_at: r.updated_at };
  }
  for (const k of Object.keys(d.progress)) if (!ids.has(k.split('|')[0])) { delete d.progress[k]; d.dirty.delete(k); }

  // 4) Punkte, Serie, Tagesziel
  const rs = ((await API.req('app_state?select=state,updated_at&' + f)) || [])[0];
  if (rs) d.state = mergeState(d.state, Object.assign({}, rs.state, { updated_at: rs.updated_at }));
  if (d.stateDirty || !rs) {
    await API.req('app_state?on_conflict=learner_id', { method: 'POST', body: [{ learner_id: d.lid, state: d.state, updated_at: nowIso() }], prefer: 'resolution=merge-duplicates,return=minimal' });
    d.stateDirty = false;
  }
  d.everSynced = true;
  saveData(d);
}
function sync(manual) {
  if (!CLOUD || !S.auth) return Promise.resolve();
  if (syncing) { syncAgain = true; return syncing; }
  syncing = (async () => {
    setSync('sync');
    try {
      await API.me();
      const migrate = await syncLearners();
      let lids = migrate ? S.learners.map(l => l.id)
        : [S.prefs.learner, VIEW === 'parent' ? (PD() || {}).lid : null, VIEW === 'stats' ? (SD() || {}).lid : null];
      lids = lids.concat(S.learners.filter(l => (DB[l.id] && DB[l.id].stateDirty) || LS.get('stateDirty_' + l.id, false)).map(l => l.id));
      lids = [...new Set(lids)].filter(id => id && learner(id));
      for (const id of lids) await syncLearner(data(id));
      // Punkte/Woche der übrigen Kinder (für Familienziel und Wochenbericht) – nur Lesen
      const others = (await API.req('app_state?select=learner_id,state,updated_at')) || [];
      for (const r of others) { if (!learner(r.learner_id) || lids.includes(r.learner_id)) continue; const od = data(r.learner_id); od.state = mergeState(od.state, Object.assign({}, r.state, { updated_at: r.updated_at })); saveData(od); }
      if (migrate) await syncLearners();
      S.prefs.everSynced = true; S.prefs.lastSync = nowIso(); savePrefs();
      setSync('ok');
      if (manual) toast('Synchronisiert ✓');
    } catch (e) {
      console.warn(e);
      setSync(navigator.onLine ? 'err' : 'off', e.message);
      if (manual) toast(navigator.onLine ? 'Sync-Fehler: ' + e.message : 'Keine Internetverbindung', true);
    } finally {
      syncing = null;
      afterSync();
      if (syncAgain) { syncAgain = false; sync(); }
    }
  })();
  return syncing;
}

  if (!VIEW || VIEW === 'session' || VIEW === 'done' || VIEW === 'login') return;
  if (VIEW !== 'pick' && S.prefs.learner && S.prefs.learner !== PARENT && !learner(S.prefs.learner)) { S.prefs.learner = null; savePrefs(); return show('pick'); }

function laVerbTable([inf, , k, st, pf]) {

function logAnswer(st, ok, xp) {
  const lg = st.log || (st.log = {}), t = dayStr();
  const e = lg[t] || (lg[t] = { n: 0, ok: 0, xp: 0 });
  e.n++; if (ok) e.ok++; e.xp += xp || 0;
  const cut = addDays(-70);
  for (const k of Object.keys(lg)) if (k < cut) delete lg[k];
}
function weekDays(off = 0) {
  const now = new Date(), dow = (now.getDay() + 6) % 7, mon = new Date(now);
  mon.setDate(now.getDate() - dow + off * 7);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return dayStr(x); });
}
function weekSum(st, off = 0) {
  const L = (st && st.log) || {}; let n = 0, ok = 0, xp = 0, days = 0;
  const per = weekDays(off).map(dd => { const e = L[dd] || {}; n += e.n || 0; ok += e.ok || 0; xp += e.xp || 0; if (e.n) days++; return e.n || 0; });
  return { n, ok, xp, days, per };
}

  const w = weekSum(d.state), pw = weekSum(d.state, -1), max = Math.max(...w.per, 1), days = weekDays(), today = dayStr();
  const lab = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  let rep = '';
  if (!opts.compact) {
    const since = addDays(-7), list = [];
    for (const v of d.vocab) for (const dr of statDirs(d, v)) { const p = prog(d, v.id, dr); if (p && p.box === 1 && (p.updated_at || '').slice(0, 10) >= since) { list.push(v); break; } }
    rep = list.length ? `<div class="label" style="margin-top:14px">Muss wiederholt werden</div>
      ${list.slice(0, 6).map(v => `<div class="wl"><span><b>${esc(wordLabel(v))}</b></span><span>${esc(transLabel(v))}</span></div>`).join('')}${list.length > 6 ? `<div class="small muted">… und ${list.length - 6} weitere</div>` : ''}` : '';
  }
  return `<div class="card">
    <h3>📅 ${opts.title || 'Diese Woche'}</h3>
    <div class="wk">${w.per.map((n, i) => `<div class="wkd ${days[i] === today ? 'today' : ''}"><b>${n || ''}</b><div class="wkb"><i style="height:${Math.round(n / max * 100)}%"></i></div><span>${lab[i]}</span></div>`).join('')}</div>
    <div class="small" style="margin-top:8px"><b>${w.days}/7</b> Tage geübt · <b>${w.n}</b> Antworten · <b>${pct(w.ok, w.n)} %</b> richtig · <b>${w.xp}</b> XP</div>

  </div>`;
}

function parseLines(text, swap, lang) {
  const ok = [], bad = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    if (isDeLang(lang)) { const r = parseDe(line); if (r) ok.push(r); else bad.push(line); continue; }
    let parts = null;
    if (line.includes('\t')) parts = line.split('\t');
    else if (line.includes(';')) parts = line.split(';');
    else { const m = line.split(/\s+[–—-]\s+|\s*=\s*|\s{2,}/); if (m.length >= 2) parts = m; }
    parts = parts ? parts.map(s => s.trim()).filter(Boolean) : null;
    if (!parts || parts.length < 2) { bad.push(line); continue; }
    let [a, b, ...rest] = parts;
    if (swap) [a, b] = [b, a];
    ok.push({ term: a, translation: b, note: rest.join('; ') || null });
  }
  return { ok, bad };
}
/* Deutsch: Wort ; Wortart ; Artikel ; Notiz  (alles außer dem Wort ist optional) */
function parseDe(line) {
  let parts = line.includes('\t') ? line.split('\t') : line.includes(';') ? line.split(';') : line.split(/\s+[–—]\s+/);
  parts = parts.map(s => s.trim());
  let word = parts[0] || '', wa = parts[1] || '', art = parts[2] || '';
  const rest = parts.slice(3).filter(Boolean);
  const m = word.match(/^(der|die|das)\s+(.+)$/i);
  if (m) { art = art || m[1].toLowerCase(); word = m[2].trim(); }
  if (!word || word.length > 60) return null;
  if (/^(der|die|das)$/i.test(wa)) { if (art && !/^(der|die|das)$/i.test(art)) rest.unshift(art); art = wa.toLowerCase(); wa = 'Nomen'; }
  let w = normWa(wa);
  if (w === null) { rest.unshift(wa); w = ''; }
  if (art) { if (/^(der|die|das)$/i.test(art)) art = art.toLowerCase(); else { rest.unshift(art); art = ''; } }
  if (!w && art) w = 'Nomen';
  if (!w && /^\p{Lu}/u.test(word)) w = 'Nomen';
  return { term: word, translation: packDe(w, art), note: rest.join('; ') || null };
}

function updatePreview() {

async function doImport() {
  const d = PD(), lang = IMP.lang;
  const unit = (IMP.unit === '__new' ? IMP.newUnit : IMP.unit || '').trim();
  if (!unit) return toast('Bitte einen Namen für die Unit angeben', true);
  const { ok } = parseLines(IMP.text, IMP.swap, lang);
  if (!ok.length) return toast('Keine Vokabeln erkannt', true);
  const existing = new Set(d.vocab.filter(v => v.lang === lang && v.unit === unit).map(v => norm(v.term) + '|' + norm(v.translation)));
  const base = Date.now(), list = []; let dup = 0;
  ok.forEach((r, i) => {
    const k = norm(r.term) + '|' + norm(r.translation);
    if (existing.has(k)) { dup++; return; }
    existing.add(k);
    list.push({ id: uuid(), lang, unit, term: r.term, translation: r.translation, note: r.note, created_at: new Date(base + i).toISOString() });
  });
  const btn = $('[data-act="imp-add"]'); btn.disabled = true;
  try {
    await vocabInsert(d, list);
    IMP.text = ''; IMP.unit = unit; IMP.newUnit = '';
    toast(`${list.length} Vokabeln hinzugefügt` + (dup ? ` · ${dup} doppelte übersprungen` : ''));
    renderImport();
  } catch (e) {
    toast('Fehler beim Speichern: ' + e.message, true); btn.disabled = false;
  }
}

async function exportBackup() {
  if (CLOUD) await sync();
  const learnersData = S.learners.map(l => { const d = data(l.id); return { id: l.id, name: l.name, created_at: l.created_at, vocab: d.vocab, progress: d.progress, state: d.state }; });
  const out = { app: 'vokabeltrainer', version: 2, exported: nowIso(), learners: learnersData };
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'vokabeltrainer-sicherung-' + dayStr() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  if (CLOUD) toast('Hinweis: Sicherung enthält die zuletzt abgeglichenen Daten');
}
async function importBackup(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.learners)) throw new Error('Keine gültige Sicherungsdatei');
    let nv = 0, np = 0;
    for (const bl of j.learners) {
      if (!bl || !bl.id) continue;
      if (!learner(bl.id)) {
        const l = { id: bl.id, name: bl.name || 'Kind', created_at: bl.created_at || nowIso() };
        if (CLOUD) await API.req('learners', { method: 'POST', body: l, prefer: 'resolution=ignore-duplicates,return=minimal' });
        S.learners.push(l); sortLearners(); saveLearners();
      }
      const d = data(bl.id);
      const have = new Set(d.vocab.map(v => v.id));
      const add = (bl.vocab || []).filter(v => v && v.id && v.term && v.translation && !have.has(v.id))
        .map(v => ({ id: v.id, lang: v.lang, unit: v.unit || 'Import', term: v.term, translation: v.translation, note: v.note || null, created_at: v.created_at || nowIso() }));
      await vocabInsert(d, add); nv += add.length;
      for (const [k, p] of Object.entries(bl.progress || {})) {
        const l = d.progress[k];
        if (p && (!l || ts(p.updated_at) > ts(l.updated_at))) { d.progress[k] = p; d.dirty.add(k); np++; }
      }
      if (bl.state) { d.state = mergeState(d.state, bl.state); touchState(d); }
      saveData(d);
      if (CLOUD) await syncLearner(d);
    }
    toast(`Wiederhergestellt: ${nv} Vokabeln, ${np} Lernstände`);
    if (VIEW === 'parent') renderParent();
  } catch (e) { toast('Import fehlgeschlagen: ' + e.message, true); }
}

/* ============================================================
   Ereignisse
   ============================================================ */
const ACT = {
  go: el => show(el.dataset.v),
  home: () => { SES = null; show('home'); },
  pick: el => pickLearner(el.dataset.v),
  lang: el => { S.prefs.lang = el.dataset.v; S.prefs.langChosen = true; S.prefs.unit = '*'; savePrefs(); renderHome(); },
  unit: el => { S.prefs.unit = el.dataset.v; savePrefs(); renderHome(); },
  dir: el => { S.prefs.dir = el.dataset.v; savePrefs(); renderHome(); },
  dedir: el => { S.prefs.deDir = el.dataset.v; savePrefs(); renderHome(); },
  'dk-play': el => { const it = cur(); const a = deInfo(it.card).art; speak((a ? a + ' ' : '') + it.card.term, 'de', el.dataset.slow ? 0.55 : 0.85); const i = $('#ti'); if (i && !i.disabled) i.focus(); },
  'dk-show': () => { const p = $('#dkword'); if (!p) return; p.hidden = false; setTimeout(() => { p.hidden = true; }, 2500); },
  mode: el => { S.prefs.mode = el.dataset.v; savePrefs(); renderHome(); },
  start: () => startSession(),
  'start-test': () => startSession('test'),
  'start-math': () => startMath(),
  maop: el => { S.prefs.maOp = el.dataset.v; savePrefs(); renderHome(); },
  marow: el => { S.prefs.maRow = el.dataset.v; savePrefs(); renderHome(); },
  widir: el => { S.prefs.wiDir = el.dataset.v; savePrefs(); renderHome(); },
  dunno3: () => answerVerb(true),
  'acc3': el => { const a = document.activeElement && /^tv\d$/.test(document.activeElement.id) ? document.activeElement : $('#tv0'); if (!a || a.disabled) return; const s0 = a.selectionStart ?? a.value.length, e0 = a.selectionEnd ?? s0; a.value = a.value.slice(0, s0) + el.dataset.c + a.value.slice(e0); a.setSelectionRange(s0 + 1, s0 + 1); a.focus(); },
  'ho-play': el => { const it = cur(); speak(it.card.term, it.card.lang, el.dataset.slow ? 0.55 : 0.85); },
  'start-latin': () => startLatin(),
  lfkind: el => { S.prefs.lfKind = el.dataset.v; savePrefs(); renderHome(); },
  fxf: el => { FX.f = el.dataset.v; renderFormeln(); },
  fxl: el => { FX.l = el.dataset.v; renderFormeln(); },
  'fam-save': () => {
    const title = $('#famtitle').value.trim(), target = parseInt($('#famtarget').value, 10) || 1500;
    if (!title) return toast('Bitte eine Belohnung eintragen', true);
    setFamilyGoal({ title, target }); sync(); toast('Familienziel gespeichert'); renderParent();
  },
  'fam-del': () => { if (!confirm('Familienziel entfernen?')) return; setFamilyGoal({ title: null, target: 0 }); sync(); renderParent(); },
  'rw-save': () => {
    const d = PD(); if (!d) return;
    const title = $('#rwtitle').value.trim(), target = parseInt($('#rwtarget').value, 10) || 1000;
    if (!title) return toast('Bitte eine Belohnung eintragen', true);
    d.state.reward = { title, target, base: d.state.xp || 0, at: nowIso() }; d.state.settingsAt = nowIso();
    touchState(d); saveData(d); sync(); toast('Belohnungsziel gestartet'); renderParent();
  },
  'rw-del': () => {
    const d = PD(); if (!d || !confirm('Belohnungsziel entfernen?')) return;
    d.state.reward = null; d.state.settingsAt = nowIso(); touchState(d); saveData(d); sync(); renderParent();
  },
  'retry-wrong': () => { const w = SES.summary.wrong; SES.d = AD(); startSession(w); },
  speak: el => speak(el.dataset.t, el.dataset.l),
  quit: () => { if (confirm('Runde beenden? Alles bis hier ist gespeichert.')) finish(); },
  dunno: () => answerType(true),
  acc: el => { const i = $('#ti'); if (!i || i.disabled) return; const s = i.selectionStart ?? i.value.length, e = i.selectionEnd ?? s; i.value = i.value.slice(0, s) + el.dataset.c + i.value.slice(e); i.setSelectionRange(s + 1, s + 1); i.focus(); },
  mc: el => answerMC(+el.dataset.i),
  flip: () => revealFlip(),
  know: () => flipAnswer(true),
  notknow: () => flipAnswer(false),
  override: () => overrideCorrect(),
  next: () => nextQ(),
  'sync-now': () => { if (!CLOUD) return toast('Lokaler Testmodus – keine Cloud eingerichtet'); sync(true); },
  slearner: el => { S.prefs.slearner = el.dataset.v; savePrefs(); renderStats(); sync(); },
  plearner: el => { S.prefs.plearner = el.dataset.v; savePrefs(); LST.unit = '*'; LST.langChosen = false; IMP.langChosen = false; renderParent(); sync(); },
  lock: () => { UNLOCK = false; renderParent(); },
  ptab: el => { PTAB = el.dataset.v; if (PTAB === 'shared') { SHARED.list = null; SHARED.err = null; } renderParent(); },
  'shared-reload': () => { SHARED.list = null; SHARED.err = null; renderShared(); },
  'shared-take': async el => {
    const row = (SHARED.list || []).find(r => r.id === el.dataset.id), d = PD();
    if (!row || !d) return;
    el.disabled = true;
    try { const n = await importShared(row, d); toast(n ? `${n} Vokabeln zu ${(learner(d.lid) || {}).name} übernommen` : 'Schon vollständig vorhanden'); }
    catch (e) { toast('Fehler: ' + e.message, true); }
    el.disabled = false;
  },
  'shared-del': async el => {
    const row = (SHARED.list || []).find(r => r.id === el.dataset.id); if (!row) return;
    if (!confirm(`Freigabe von „${row.unit}“ zurückziehen? Wer sie schon übernommen hat, behält seine Kopie.`)) return;
    try { await API.req('shared_units?id=eq.' + row.id, { method: 'DELETE' }); SHARED.list = SHARED.list.filter(r => r.id !== row.id); toast('Freigabe zurückgezogen'); renderShared(); }
    catch (e) { toast('Fehler: ' + e.message, true); }
  },
  'unit-share': () => {
    const n = cardsFor(PD(), LST.lang, LST.unit).length;
    openModal(`<h2>„${esc(LST.unit)}“ teilen</h2>
      <p class="muted small">Die ${n} Vokabeln werden für alle Familien in dieser App sichtbar und können übernommen werden. Namen der Kinder und Lernstände werden nicht geteilt. Teilst du die Unit später erneut, wird die Freigabe aktualisiert.</p>
      <div class="f"><label>Angezeigt als</label><input id="shby" class="field" value="${esc(S.prefs.shareName || '')}" placeholder="z. B. Familie Müller" maxlength="40"></div>
      <div class="row"><button class="btn ghost grow" data-act="modal-close">Abbrechen</button><button class="btn primary grow" data-act="unit-share-go">Freigeben</button></div>`);
  },
  'unit-share-go': async el => {
    const by = $('#shby').value.trim(); if (!by) return toast('Bitte einen Namen angeben', true);
    S.prefs.shareName = by; savePrefs(); el.disabled = true;
    try { const n = await shareUnit(PD(), LST.lang, LST.unit, by); closeModal(); SHARED.list = null; toast(`${n} Vokabeln geteilt`); }
    catch (e) { toast('Fehler: ' + e.message, true); el.disabled = false; }
  },
  'pw-change': () => openPwChange(),
  'imp-add': () => doImport(),
  'imp-irregular': async el => {
    const d = PD(); if (!d) return;
    const unit = 'Irregular verbs';
    const have = new Set(d.vocab.filter(v => v.lang === 'en').map(v => norm(v.term)));
    const base = Date.now();
    const list = IRREGULAR.map(([a, b, c, de]) => ({ term: `${a} – ${b} – ${c}`, translation: de }))
      .filter(v => !have.has(norm(v.term)))
      .map((v, i) => ({ id: uuid(), lang: 'en', unit, term: v.term, translation: v.translation, note: null, created_at: new Date(base + i).toISOString() }));
    el.disabled = true;
    try { await vocabInsert(d, list); toast(list.length ? `${list.length} Verben in „${unit}“ eingefügt` : 'Schon alle vorhanden'); IMP.unit = unit; renderImport(); }
    catch (e) { toast('Fehler: ' + e.message, true); el.disabled = false; }
  },
  edit: el => openEdit(el.dataset.id),
  'edit-save': el => saveEdit(el.dataset.id),
  'edit-del': el => delVocab(el.dataset.id),
  'modal-close': () => closeModal(),
  'unit-rename': async () => {
    const n = (prompt('Neuer Name für „' + LST.unit + '“:', LST.unit) || '').trim();
    if (!n || n === LST.unit) return;
    try { await unitRename(PD(), LST.lang, LST.unit, n); LST.unit = n; toast('Umbenannt'); renderList(); } catch (e) { toast('Fehler: ' + e.message, true); }
  },
  'unit-del': async () => {
    const n = cardsFor(PD(), LST.lang, LST.unit).length;
    if (!confirm(`„${LST.unit}“ mit ${n} Vokabeln und dem zugehörigen Lernstand endgültig löschen?`)) return;
    try { await unitDelete(PD(), LST.lang, LST.unit); LST.unit = '*'; toast('Unit gelöscht'); renderList(); } catch (e) { toast('Fehler: ' + e.message, true); }
  },
  'unit-copy': () => {
    const from = PD();
    openModal(`<h2>„${esc(LST.unit)}“ kopieren</h2><p class="muted small">Die Vokabeln werden dem anderen Kind hinzugefügt. Der Lernstand startet dort neu.</p>
      ${S.learners.filter(l => l.id !== from.lid).map(l => `<button class="lbtn" data-act="unit-copy-to" data-v="${l.id}"><span class="av">${esc(l.name.slice(0, 1).toUpperCase())}</span>${esc(l.name)}</button>`).join('')}
      <button class="btn ghost wide" data-act="modal-close">Abbrechen</button>`);
  },
  'unit-copy-to': async el => {
    try {
      const to = data(el.dataset.v);
      if (CLOUD) await syncLearner(to);
      const n = await unitCopy(PD(), to, LST.lang, LST.unit);
      closeModal(); toast(`${n} Vokabeln an ${(learner(to.lid) || {}).name} kopiert`);
    } catch (e) { toast('Fehler: ' + e.message, true); }
  },
  'l-rename': async el => {
    const l = learner(el.dataset.id); if (!l) return;
    const n = (prompt('Neuer Name:', l.name) || '').trim();
    if (!n || n === l.name) return;
    try { await learnerRename(l.id, n); toast('Umbenannt'); renderParent(); } catch (e) { toast('Fehler: ' + e.message, true); }
  },
  'l-del': async el => {
    const l = learner(el.dataset.id); if (!l) return;
    if (!confirm(`Profil „${l.name}“ mit allen Vokabeln und dem gesamten Lernstand endgültig löschen?`)) return;
    if (prompt(`Zur Sicherheit bitte „${l.name}“ eintippen:`) !== l.name) return toast('Abgebrochen');
    try { await learnerDelete(l.id); toast('Profil gelöscht'); renderParent(); } catch (e) { toast('Fehler: ' + e.message, true); }
  },
  'goal-save': () => {
    const d = PD(); if (!d) return;
    d.state.goal = parseInt($('#sgoal').value, 10) || 20; d.state.settingsAt = nowIso();
    touchState(d); saveData(d); sync(); toast('Gespeichert');
  },
  'pin-change': () => {
    const p = (prompt('Neue PIN (4–6 Ziffern):') || '').trim();
    if (!p) return;
    if (!/^\d{4,6}$/.test(p)) return toast('PIN muss 4–6 Ziffern haben', true);
    S.prefs.pin = p; savePrefs(); toast('PIN geändert');
  },
  export: () => exportBackup(),
  'import-file': () => $('#bfile').click(),
  logout: async () => {
    if (!confirm('Abmelden? Die Daten werden vorher abgeglichen und danach von diesem Gerät entfernt (in der Cloud bleiben sie erhalten).')) return;
    await sync();
    if (SYNC.s !== 'ok' && !confirm('Der Abgleich hat nicht geklappt – noch nicht hochgeladene Lernstände gehen verloren. Trotzdem abmelden?')) return;
    S.auth = null; LS.set('auth', null); wipeLocal(); show('login');
  }
};
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-act="acc"],[data-act="acc3"]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'tf') answerType(false);
  else if (id === 'lf') doLogin();
  else if (id === 'pinf') doPin();
  else if (id === 'nlf') addLearnerFromPick();
  else if (id === 'nlf2') addLearnerFromSettings();
  else if (id === 'pwf') doPwChange();
  else if (id === 'tf3') answerVerb(false);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'itext') { IMP.text = e.target.value; updatePreview(); }
  else if (id === 'inewunit') IMP.newUnit = e.target.value;
  else if (id === 'lq') { LST.q = e.target.value; renderVList(); }
  else if (id === 'fxq') { FX.q = e.target.value; renderFxList(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'ilang') { IMP.lang = v; IMP.langChosen = true; IMP.unit = null; renderImport(); }
  else if (id === 'iunit') { IMP.unit = v; $('#inewwrap').hidden = v !== '__new'; if (v === '__new') $('#inewunit').focus(); }
  else if (id === 'iswap') { IMP.swap = e.target.checked; updatePreview(); }
  else if (id === 'llang') { LST.lang = v; LST.langChosen = true; LST.unit = '*'; renderList(); }
  else if (id === 'lunit') { LST.unit = v; renderList(); }
  else if (id === 'sdev') { S.prefs.learner = v; savePrefs(); toast('Gerät zugeordnet'); sync(); }
  else if (id === 'sauto') { S.prefs.autoSpeak = e.target.checked; savePrefs(); }
  else if (id === 'smlevel') { const d = PD(); if (d) { d.state.mathLevel = v; d.state.showMath = v !== 'off'; d.state.settingsAt = nowIso(); touchState(d); saveData(d); sync(); toast('Gespeichert'); } }

  else if (id === 'bfile') { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && /^tv\d$/.test((document.activeElement || {}).id || '')) { const nx = $('#tv' + (+document.activeElement.id.slice(2) + 1)); if (nx) { e.preventDefault(); nx.focus(); return; } }
  if (e.key !== 'Enter' || VIEW !== 'session' || !SES) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'BUTTON')) return;
  if (cur().answered) { e.preventDefault(); nextQ(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  sync();
  if (VIEW === 'home') renderHome();
});
window.addEventListener('online', () => sync());

/* ============================================================
   Start
   ============================================================ */
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn(e));
show(CLOUD && !S.auth ? 'login' : (S.prefs.learner ? 'home' : 'pick'));
sync();
</script>
